[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repuestos-inteligencia-comercial"
version = "0.1.0"
description = "Plataforma local de inteligencia comercial e inventario para repuestos automotrices"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "streamlit", "fastapi", "uvicorn", "httpx", "joblib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
